# render.yaml — Render Blueprint for MediConnect
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: mediconnect-db
    databaseName: mediconnect
    user: mediconnect
    plan: free
    region: singapore

services:
  # ─── Next.js Main App ───────────────────────────────────────────────────────
  - type: web
    name: mediconnect-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    preDeployCommand: "npx prisma db push"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mediconnect-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false  # Set this to your Render URL after first deploy
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false  # Set this to your Render URL after first deploy
      - key: NEXT_PUBLIC_SIGNALING_URL
        sync: false  # Set to https://mediconnect-signaling.onrender.com after first deploy
      - key: ALLOWED_ORIGIN
        sync: false  # Set to https://mediconnect-app.onrender.com after first deploy
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: FIREBASE_SERVER_KEY
        sync: false
    buildFilter:
      paths:
        - "**"
        - "!server/**"  # Only rebuild app when non-server files change

  # ─── Express + Socket.io Signaling Server ───────────────────────────────────
  - type: web
    name: mediconnect-signaling
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    region: singapore
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false  # Set to https://mediconnect-app.onrender.com after first deploy
      - key: JWT_SECRET
        generateValue: true
    buildFilter:
      paths:
        - server/**
